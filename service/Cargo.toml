[package]
name = "autoscribe-service"
autobins = false
version = "0.4.0"
edition = "2024"
description = "On-demand AutoScribe service operations"
license = "Proprietary"

[lib]
name = "autoscribe_service"
path = "src/lib.rs"

[[bin]]
name = "dispatch"
path = "src/bin/dispatch.rs"

[[bin]]
name = "writeback"
path = "src/bin/writeback.rs"

[[bin]]
name = "inflight"
path = "src/bin/inflight.rs"

[[bin]]
name = "writenew"
path = "src/bin/writenew.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

skim = { version = "=5.7.0", default-features = false }
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
